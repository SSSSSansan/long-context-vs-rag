# Все параметры здесь. В коде — ничего захардкоженного.
seed: 42

backends:
  openai:
    # ПРОВЕРИТЬ ПЕРЕД СТАРТОМ: полный идентификатор модели с датой + актуальные цены
    # https://platform.openai.com/docs/pricing
    # V2: рабочая модель gpt-6-luna. У неё НЕТ датированного снапшота, id вписан как есть
    # (поведение модели может меняться со временем). Поэтому в raw.jsonl логируется и поле model_api:
    # id, который вернул сам API. Цены подтверждены Panda 2026-11-13 по странице цен OpenAI.
    chat_model: gpt-6-luna
    judge_model: gpt-6-luna     # судью нужно рекалибровать на 40 примерах (PLAN_V2 §7)
    embed_model: text-embedding-3-small
    context_window: 1050000
    tokenizer: o200k_base
    price_per_1m_usd:
      input: 0.10
      cached_input: 0.01
      output: 0.50
      embed: 0.02
      long_context: {threshold: 272000, input_mult: 2.0, output_mult: 1.5}
  local:
    chat_model: qwen2.5-7b-32k  # Ollama-модель с num_ctx 32768 (см. Modelfile.qwen2.5-7b-32k)
    judge_model: qwen2.5-7b-32k
    embed_model: BAAI/bge-m3
    context_window: 32768      # должно совпадать с num_ctx в Modelfile
    tokenizer: o200k_base      # единый счётчик токенов для сборки корпусов (см. README)
    price_per_1m_usd: {input: 0.0, cached_input: 0.0, output: 0.0, embed: 0.0}

# цены моделей для CHAT_MODEL=<id> (проверить на https://platform.openai.com/docs/pricing)
model_prices:
  # $/1M токенов. long_context: при prompt_tokens > threshold вход x input_mult, выход x output_mult.
  # GPT-6: цены подтверждены Panda 2026-11-13. Датированных снапшотов у gpt-6-* нет.
  gpt-6-luna:    {input: 0.10, cached_input: 0.01, output: 0.50,  embed: 0.02, long_context: {threshold: 272000, input_mult: 2.0, output_mult: 1.5}}
  gpt-6.1-terra: {input: 1.00, cached_input: 0.05, output: 5.00,  embed: 0.02, long_context: {threshold: 272000, input_mult: 2.0, output_mult: 1.5}}
  gpt-6.1-sol:   {input: 2.00, cached_input: 0.10, output: 10.00, embed: 0.02, long_context: {threshold: 272000, input_mult: 2.0, output_mult: 1.5}}
  # V1 (базовая линия, архив v1/):
  gpt-4o-mini-2024-07-18: {input: 0.15, cached_input: 0.075, output: 0.60, embed: 0.02}
  gpt-4o-2024-08-06: {input: 2.50, cached_input: 1.25, output: 10.00, embed: 0.02}

generation:
  temperature: 0.0
  max_tokens: 512

retrieval:
  chunk_tokens: 300
  chunk_overlap: 40
  top_k: 8
  hybrid_candidates: 20            # HYB: кандидатов от dense и от BM25
  rrf_k: 60                        # константа RRF
  reranker_model: BAAI/bge-reranker-v2-m3   # cross-encoder, Apache 2.0, локально
  qdrant: {mode: memory}       # memory | http://localhost:6333

budget:
  cache_dir: runs/cache
  budget_file: runs/budget_v2.json   # V2; старый счётчик V1 лежит в runs/v1/budget.json

# AGENT (PLAN_V2 §3.4): модель сама ищет фрагменты инструментами вместо готового {context}
agent:
  max_tool_calls: 8          # лимит вызовов инструментов на эпизод; дальше принудительный финальный ответ
  search_k_default: 5
  search_k_max: 8
  snippet_chars: 240         # search_corpus отдаёт только начало чанка; целиком — get_chunk
  notion_dir: runs/notion_mock   # write_to_notion — мок без сети, пишет .md сюда
  openai_reasoning_effort: none   # gpt-6-*: function tools в chat/completions работают только при reasoning_effort=none (иначе 400). Только OpenAI-бэкенд; в отчёт: отличие от LC/RAG
  notion_instruction: false  # true — к заглушке {context} добавляется просьба сохранить ответ в Notion (для демо-видео)
