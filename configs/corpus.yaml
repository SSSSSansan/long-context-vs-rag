sizes_tokens: {"8k": 8000, "30k": 30000, "100k": 100000}   # вложенные: 8k ⊂ 30k ⊂ 100k
size_tolerance: 0.03
facts:
  # V2 (PLAN_V2 §2.1, §8 1.2). Сколько вопросов каждого типа ВПЕРВЫЕ появляется на этом размере.
  # Набор A ("ядро") = уровень core_level: все его факты лежат в подкорпусе 8K, поэтому эти 18 вопросов
  # можно задать на всех трёх размерах (within-subject). Набор B = факты, добавленные на 30K и 100K:
  # на 8K их нет, а на 100K доступны все 60 вопросов (18 + 42).
  # Факты: 8k = 6 + 12 + 12 = 30; 30k = 7 + 14 + 14 = 35; 100k = 35; всего 100.
  core_level: "8k"
  levels:
    "8k":   {T1: 6, T2: 6, T3: 6}     # набор A
    "30k":  {T1: 7, T2: 7, T3: 7}     # набор B
    "100k": {T1: 7, T2: 7, T3: 7}     # набор B
  # A-hard (src/hard_set.py): связка из 3 признаков рядом с каждым фактом набора A + дистракторы
  hard:
    enabled: true
    n_offices: 12                   # подразделения-признаки берутся из самых частых в фоновом корпусе
    link_style: compact                # full | compact (compact короче, но менее похожа на стиль документов)
    distractors_per_entity: 0       # двойников на каждую сущность вопроса; 0 = без дистракторов
  position_facts: 5
  # V2 P1 (18.11): если задан блок position, он заменяет position_facts/position_levels_pct. facts — сколько T1-вопросов (с якорем,
  # отвечаемых на этом размере, по qid) берётся на размер; levels_pct — позиции факта: начало / середина / конец.
  position:
    levels_pct: [0, 50, 100]
    facts: {"30k": 13, "100k": 6}
  position_levels_pct: [0, 25, 50, 75, 100]
raw_dir: corpus/raw
planted_dir: corpus/built/planted   # документы с внедрёнными фактами (git не коммитится)
built_dir: corpus/built

# синтетический фоновый корпус (src/gen_raw_corpus.py)
raw_generation:
  n_docs: 48
  university: "Северо-Степной технический университет"
